version: "3.8"

services:
  nl2sql-agent:
    build: .
    container_name: nl2sql-agent
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-nl2sql-agent}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
    volumes:
      # Optional: persist parquet query results
      - ./data:/app/data
      # Optional: live-reload frontend during development
      # - ./telemetry.html:/app/static/telemetry.html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s